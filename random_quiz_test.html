<body>
    
    \
    <div id="quiz-panel" style="position: fixed; top: 16px; left: 16px; z-index: 9999; background: rgba(255,255,255,0.94); border-radius: 10px; padding: 12px 14px; box-shadow: 0 6px 18px rgba(0,0,0,0.2); max-width: 340px; font-family: Helvetica Neue, Arial, sans-serif;">
      <div style="font-weight: 700; margin-bottom: 6px;">Guess The Person</div>
      <div id="quiz-progress" style="font-size: 12px; color: #555; margin-bottom: 6px;">Round 1/2</div>
      <div style="font-size: 13px; margin-bottom: 8px;">One guess per round. Wrong answers move to the next person.</div>
      <input id="quiz-input" type="text" placeholder="Type a name" style="width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #bdbdbd; border-radius: 6px; margin-bottom: 8px;" />
      <button id="quiz-submit" style="width: 100%; padding: 7px 8px; border: 0; border-radius: 6px; background: #1565c0; color: white; font-weight: 700; cursor: pointer;">Submit Guess</button>
      <div id="quiz-result" style="margin-top: 8px; font-size: 13px;"></div>
      <div id="quiz-stats" style="margin-top: 6px; font-size: 12px; color: #666; font-weight: 600;">Correct: <span id="correct-count">0</span> | Wrong: <span id="wrong-count">0</span></div>
    </div>
    <script>
      (function() {
        const rounds = [{"person": "Amerigo Vespucci", "birth": {"lat": 43.77139, "lon": 11.25417, "popup": "<b>Birth</b><br>Place: Florence", "icon": "\n    <svg xmlns=\"http://www.w3.org/2000/svg\" width=\"320\" height=\"90\" viewBox=\"0 0 320 90\">\n        <polygon points=\"160,0 148,22 172,22\" fill=\"#1b5e20\" />\n        <rect x=\"79\" y=\"32\" width=\"162\" height=\"30\" rx=\"8\" ry=\"8\" fill=\"white\" fill-opacity=\"0.84\" /><text x=\"160\" y=\"53\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"bold\" font-family=\"Helvetica Neue, Arial, sans-serif\" fill=\"#1b5e20\">9 March 1454</text>\n    </svg>\n    "}, "death": {"lat": 37.39, "lon": -5.99, "popup": "<b>Death</b><br>Place: Seville", "icon": "\n    <svg xmlns=\"http://www.w3.org/2000/svg\" width=\"320\" height=\"90\" viewBox=\"0 0 320 90\">\n        <polygon points=\"148,68 172,68 160,90\" fill=\"#b71c1c\" />\n        <rect x=\"91\" y=\"28\" width=\"138\" height=\"30\" rx=\"8\" ry=\"8\" fill=\"white\" fill-opacity=\"0.84\" /><text x=\"160\" y=\"49\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"bold\" font-family=\"Helvetica Neue, Arial, sans-serif\" fill=\"#b71c1c\">1512-02-22</text>\n    </svg>\n    "}}, {"person": "Joseph Lister", "birth": {"lat": 51.5395, "lon": 0.0232, "popup": "<b>Birth</b><br>Place: Upton House", "icon": "\n    <svg xmlns=\"http://www.w3.org/2000/svg\" width=\"320\" height=\"90\" viewBox=\"0 0 320 90\">\n        <polygon points=\"160,0 148,22 172,22\" fill=\"#1b5e20\" />\n        <rect x=\"91\" y=\"32\" width=\"138\" height=\"30\" rx=\"8\" ry=\"8\" fill=\"white\" fill-opacity=\"0.84\" /><text x=\"160\" y=\"53\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"bold\" font-family=\"Helvetica Neue, Arial, sans-serif\" fill=\"#1b5e20\">1827-04-05</text>\n    </svg>\n    "}, "death": {"lat": 51.2043, "lon": 1.3985, "popup": "<b>Death</b><br>Place: Walmer", "icon": "\n    <svg xmlns=\"http://www.w3.org/2000/svg\" width=\"320\" height=\"90\" viewBox=\"0 0 320 90\">\n        <polygon points=\"148,68 172,68 160,90\" fill=\"#b71c1c\" />\n        <rect x=\"91\" y=\"28\" width=\"138\" height=\"30\" rx=\"8\" ry=\"8\" fill=\"white\" fill-opacity=\"0.84\" /><text x=\"160\" y=\"49\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"bold\" font-family=\"Helvetica Neue, Arial, sans-serif\" fill=\"#b71c1c\">1912-02-10</text>\n    </svg>\n    "}}];
        const mapRef = map_028b88b6dcfa4ccfa3d90c221f0e58e3;

        const normalize = (value) => (value || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/['’`-]/g, "")
          .replace(/[^a-z0-9\s]/g, " ")
          .replace(/\s+/g, " ")
          .trim();

        const input = document.getElementById("quiz-input");
        const submit = document.getElementById("quiz-submit");
        const result = document.getElementById("quiz-result");
        const progress = document.getElementById("quiz-progress");
        const correctCountElement = document.getElementById("correct-count");
        const wrongCountElement = document.getElementById("wrong-count");

        let currentIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;
        const roundLayer = L.layerGroup().addTo(mapRef);

        const updateStats = () => {
          if (correctCountElement) {
            correctCountElement.textContent = String(correctCount);
          }
          if (wrongCountElement) {
            wrongCountElement.textContent = String(wrongCount);
          }
          if (progress) {
            const shownRound = Math.min(currentIndex + 1, rounds.length);
            progress.textContent = `Round ${shownRound}/${rounds.length}`;
          }
        };

        const renderRound = () => {
          const round = rounds[currentIndex];
          roundLayer.clearLayers();

          const birthIcon = L.divIcon({
            html: round.birth.icon,
            iconSize: [320, 90],
            iconAnchor: [160, 90],
            className: "empty",
          });
          L.marker([round.birth.lat, round.birth.lon], { icon: birthIcon })
            .bindPopup(round.birth.popup)
            .addTo(roundLayer);

          const deathIcon = L.divIcon({
            html: round.death.icon,
            iconSize: [320, 90],
            iconAnchor: [160, 90],
            className: "empty",
          });
          L.marker([round.death.lat, round.death.lon], { icon: deathIcon })
            .bindPopup(round.death.popup)
            .addTo(roundLayer);

          const bounds = L.latLngBounds([
            [round.birth.lat, round.birth.lon],
            [round.death.lat, round.death.lon],
          ]);
          mapRef.fitBounds(bounds.pad(0.5));
          updateStats();
        };

        const finishQuiz = () => {
          if (!input || !submit || !result || !progress) {
            return;
          }

          input.disabled = true;
          submit.disabled = true;
          submit.style.opacity = "0.65";

          const total = rounds.length;
          const accuracy = total ? Math.round((correctCount / total) * 100) : 0;
          progress.textContent = `Complete (${total}/${total})`;
          result.style.color = "#263238";
          result.innerHTML = `Finished! Correct: <b>${correctCount}</b> | Wrong: <b>${wrongCount}</b> | Accuracy: <b>${accuracy}%</b>`;
        };

        const nextRound = () => {
          currentIndex += 1;
          if (currentIndex >= rounds.length) {
            finishQuiz();
            return;
          }

          if (input) {
            input.value = "";
            input.focus();
          }
          renderRound();
        };

        const check = () => {
          if (!input || !result) {
            return;
          }

          const guess = normalize(input.value);
          if (!guess) {
            result.style.color = "#7f6000";
            result.textContent = "Enter a guess first.";
            input.focus();
            return;
          }

          const expected = normalize(rounds[currentIndex].person);
          const revealed = rounds[currentIndex].person;
          if (guess === expected) {
            correctCount += 1;
            result.style.color = "#1b5e20";
            result.textContent = `Correct! It was ${revealed}.`;
          } else {
            wrongCount += 1;
            result.style.color = "#b71c1c";
            result.textContent = `Not quite. It was ${revealed}.`;
          }

          updateStats();
          window.setTimeout(nextRound, 500);
        };

        if (submit) {
          submit.addEventListener("click", check);
        }
        if (input) {
          input.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
              check();
            }
          });
          input.focus();
        }

        renderRound();
      })();
    </script>
